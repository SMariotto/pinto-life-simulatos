<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐣Pinto Life Simulator🐣</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="galinheiro"></div>

    <div id="game-container">
        <h1>🐣Pinto Life Simulator🐣</h1>

        <div class="stats-panel">
            <p>Pontos: <span id="score">0</span></p>
            <p>Poder de Clique: <span id="power">1</span></p>
            <p>Pintinhos no Fundo: <span id="chickens">0</span></p>
            <p>Por segundo (PPS): <span id="pps">0</span></p>
            <p>Chance de Raro: <span id="critChance">15</span>%</p>
        </div>

        <div id="dog-container">
            <img id="dog" src="https://cdn-icons-png.flaticon.com/128/789/789473.png" alt="Pinto Principal">
        </div>

        <div class="controls-panel">
            <button onclick="comprarUpgrade()">
                +Poder Clique (<span id="upgradeCost">10</span>)
            </button>
            <button onclick="comprarPintinho()">
                Comprar Pinto (<span id="chickenCost">15</span>)
            </button>
            <!-- NOVOS UPGRADES SOLICITADOS -->
            <button onclick="comprarGranjaAutomatica()">
                Granja Automática (<span id="granjaCost">150</span>)
            </button>
            <button onclick="comprarSuperMilho()">
                Super Milho $2x PPS$ (<span id="milhoCost">500</span>)
            </button>
            <button onclick="comprarTreinamentoGalo()">
                Hormônio de Crescimento (<span id="hormonioCost">1200</span>)
            </button>
            <button onclick="comprarSorteSuprema()">
                Sorte Suprema +Raros (<span id="sorteCost">2000</span>)
            </button>
        </div>

        <div class="code-panel">
            <h3>🔑 Código Secreto</h3>
            <input type="text" id="codigoInput" placeholder="Digite o código...">
            <button onclick="usarCodigo()">Ativar</button>
            <p id="mensagem"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
