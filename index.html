<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>🐶 Clicker de Doguinho</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🐶 Clicker de Doguinho</h1>

    <img id="dog" src="https://cdn-icons-png.flaticon.com/512/616/616430.png">

    <p>Pontos: <span id="score">0</span></p>
    <p>Poder de clique: <span id="power">1</span></p>
    <p>Pintinhos: <span id="chickens">0</span></p>
    <p>Por segundo: <span id="pps">0</span></p>

    <button onclick="comprarUpgrade()">
    Upgrade (<span id="upgradeCost">10</span>)
  </button>

    <button onclick="comprarPintinho()">
    Comprar Pintinho (<span id="chickenCost">15</span>)
  </button>

    <h3>🔑 Código secreto</h3>
    <input type="text" id="codigoInput">
    <button onclick="usarCodigo()">Usar</button>

    <p id="mensagem"></p>

    <div id="galinheiro"></div>

    <script src="script.js"></script>
</body>

</html>
